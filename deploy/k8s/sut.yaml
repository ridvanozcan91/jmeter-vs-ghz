# Untested: see deploy/README.md.
#
# The SUT is deliberately given generous CPU. If the server saturates, the
# benchmark measures the server rather than the load generators, which is the
# one outcome that makes the whole exercise pointless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-sut
  labels:
    app: benchmark-sut
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-sut
  template:
    metadata:
      labels:
        app: benchmark-sut
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: sut
          image: benchmark-sut:local
          ports:
            - name: grpc
              containerPort: 9090
            - name: management
              containerPort: 9091
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseG1GC -Xms4g -Xmx4g"
          resources:
            # requests == limits: a guaranteed QoS pod, so the server's CPU
            # budget does not vary between runs.
            requests:
              cpu: "4"
              memory: "6Gi"
            limits:
              cpu: "4"
              memory: "6Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-sut
spec:
  selector:
    app: benchmark-sut
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: management
      port: 9091
      targetPort: management
