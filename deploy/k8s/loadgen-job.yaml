# Untested: see deploy/README.md.
#
# One Job per tool per scenario. The anti-affinity rule is the point of running
# this on a cluster at all: it is what keeps the load generator off the node
# running the SUT, so the two never compete for the same cores.
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen-ghz-echo-c128
  labels:
    app: benchmark-loadgen
    tool: ghz
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: benchmark-loadgen
        tool: ghz
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: ["benchmark-sut"]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: loadgen
          image: benchmark-loadgen:local
          env:
            - name: SUT_HOST
              value: benchmark-sut
            - name: RUN_ID
              value: k8s-run
          command: ["harness/run-matrix.sh"]
          args: ["--profile", "full", "--family", "closed"]
          resources:
            # Both tools get exactly this budget. Giving one side more would
            # make requests-per-core meaningless.
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: results
              mountPath: /app/results
      volumes:
        - name: results
          emptyDir: {}
